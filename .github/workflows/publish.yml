name: publish
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Publish to npm
        run: |
          set -o pipefail
          if npm run publish 2>&1 | tee publish.log; then
            echo "::notice::Package published successfully"
            exit 0
          fi
          if grep -q "You cannot publish over the previously published versions" publish.log; then
            echo "::warning::Package version already published, skipping..."
            exit 0
          fi
          echo "::error::Publish failed with unexpected error"
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
