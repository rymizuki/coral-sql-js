name: GitHub Pages

on:
  workflow_run:
    workflows: ['Test']
    branches: ['main']
    types:
      - completed

jobs:
  check-latest:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      is-latest: ${{ steps.latest.outputs.is-latest }}

    steps:
      - name: Check the commit is the latest one that passed Test on main
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/main.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha')
          if [ "$latest" = "$HEAD_SHA" ]; then
            echo "is-latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::latest successful Test on main is $latest; skipping deploy of $HEAD_SHA"
            echo "is-latest=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-latest
    if: needs.check-latest.outputs.is-latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false

    steps:
      - name: Checkout the commit that passed Test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run build:docs

      - name: Deploy docs to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          full_commit_message: 'deploy: ${{ github.event.workflow_run.head_sha }}'
